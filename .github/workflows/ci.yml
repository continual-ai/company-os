name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-node24-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-turbo-

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
