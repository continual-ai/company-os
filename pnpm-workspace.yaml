allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: false
  unrs-resolver: true
  # msw, sharp, and workerd are inert until such a dependency is actually installed.
  msw: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@continual/cli@0.5.8"
  - "@continual/sdk@0.1.5"
  - "@continual/tanstack-start@0.1.3"

patchedDependencies:
  # PostgreSQL retains completed nested savepoints unless they are explicitly released.
  effect@4.0.0-rc.116: patches/effect@4.0.0-rc.116.patch
  nitro@3.0.260610-beta: patches/nitro@3.0.260610-beta.patch
