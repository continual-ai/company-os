packages:
  - "apps/*"
  - "packages/*"
  - "templates/*"
  - "tools"
  # Unused by the standalone project; pre-satisfies the Continual create-app
  # skill's project preparation so it never rewrites this file.
  - "modules/*"

catalog:
  "@base-ui/react": 1.7.0
  "@continual/cli": 0.5.8
  "@continual/sdk": 0.1.5
  "@continual/tanstack-start": 0.1.3
  "@effect/platform-node": 4.0.0-beta.107
  "@effect/sql-pg": 4.0.0-beta.107
  "@effect/vitest": 4.0.0-beta.107
  "@modelcontextprotocol/server": 2.0.0
  "@fontsource-variable/geist": 5.3.0
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-router": 1.170.16
  "@tanstack/react-start": 1.168.26
  "@tanstack/react-table": 9.1.2
  "@types/node": 24.13.3
  "@types/pg": 8.23.1
  "@types/react": 19.2.15
  "@types/react-dom": 19.2.3
  "class-variance-authority": 0.7.1
  "clsx": 2.1.1
  "cmdk": 1.1.1
  "date-fns": 4.4.0
  "drizzle-kit": 1.0.0-rc.5-ab785fc
  "drizzle-orm": 1.0.0-rc.5-ab785fc
  "effect": 4.0.0-beta.107
  "lucide-react": 1.30.0
  "pg": 8.23.0
  "react": 19.2.6
  "react-day-picker": 10.0.1
  "react-dom": 19.2.6
  "react-phone-number-input": 3.4.18
  "recharts": 3.10.1
  "shadcn": 4.16.2
  "tailwind-merge": 3.6.0
  "tailwindcss": 4.3.0
  "tsx": 4.23.12
  "typeid-js": 1.2.0
  "tw-animate-css": 1.4.0
  "typescript": 7.0.2
  "vite": 8.0.16
  "vitest": 4.1.11
  # drizzle-orm's optional zod peer must resolve identically in every importer
  # or pnpm builds type-incompatible drizzle instances; @continual/sdk pulls
  # zod 3 into the app graph, so the app pins the workspace-wide choice.
  "zod": 4.4.3

allowBuilds:
  esbuild: true
  lightningcss: true
  msgpackr-extract: false
  unrs-resolver: true
  # msw, sharp, and workerd match the Continual create-app skill's expected
  # allowlist; they are inert until such a dependency is actually installed.
  msw: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@continual/cli@0.5.8"
  - "@continual/sdk@0.1.5"
  - "@continual/tanstack-start@0.1.3"
